<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C0C0C" />
    <meta
      name="description"
      content="Gurwinder Singh — IT Support Engineer specializing in desktop support, network administration, and VoIP and IP telephony deployment."
    />
    <meta name="author" content="Gurwinder Singh" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gurwinder Singh — IT Support Engineer" />
    <meta
      property="og:description"
      content="Desktop support, network administration, and VoIP and IP telephony deployment in Delhi NCR."
    />
    <meta property="og:image" content="__SITE_URL__/profile-pic.jpeg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Icon set: the animated SVG is the canonical mark and animates in the
         tab in Chrome, Edge, and Firefox. The .ico and PNGs are the fallbacks
         for Safari, bookmarks, pinned tabs, and iOS. Regenerate the rasters
         with `npm run favicon`. -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Gurwinder Singh" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Gurwinder Singh — IT Support Engineer | Delhi NCR</title>
    <!-- Rewritten at build time by the site-url plugin in vite.config.ts. -->
    <link rel="canonical" href="__SITE_URL__/" />

    <!-- Self-hosted Kanit. Preloading the 400 face starts the fetch during HTML
         parse instead of waiting for the stylesheet to be parsed, which is the
         single biggest win over the previous Google Fonts request. The build
         hashes the filename, so the real href is injected by the font-preload
         plugin in vite.config.ts; this is the unhashed dev fallback. -->
    <link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/kanit-latin-400.woff2" crossorigin />

    <!-- GitHub Pages cannot send HTTP response headers, so the strongest
         available policy is a meta CSP. `style-src` needs 'unsafe-inline'
         because the app sets element styles inline throughout, and React
         injects the stylesheet as a style tag. frame-ancestors is ignored in
         meta form; see README for the header-level equivalent. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Loaded without `defer` so the timer starts before the bundle finishes
         parsing; that is the window this net exists to cover. -->
    <script src="./site-safety-net.js"></script>
  </body>
</html>
