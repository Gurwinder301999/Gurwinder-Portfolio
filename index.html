<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C0C0C" />
    <meta
      name="description"
      content="Gurwinder Singh — IT Support Engineer specializing in desktop support, network administration, and VoIP and IP telephony deployment."
    />
    <meta name="author" content="Gurwinder Singh" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gurwinder Singh — IT Support Engineer" />
    <meta
      property="og:description"
      content="Desktop support, network administration, and VoIP and IP telephony deployment in Delhi NCR."
    />
    <meta property="og:image" content="__SITE_URL__/profile-pic.jpeg" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Gurwinder Singh — IT Support Engineer | Delhi NCR</title>
    <!-- Rewritten at build time by the site-url plugin in vite.config.ts. -->
    <link rel="canonical" href="__SITE_URL__/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Safety net: if the bundle never mounts, the site is being served without
      // being built (a classic cause is GitHub Pages set to "Deploy from a
      // branch" instead of "GitHub Actions"). Show a real message instead of a
      // blank white page. In a correct build React fills #root and this
      // never triggers.
      (function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;

          root.innerHTML =
            '<div style="min-height:100vh;display:grid;place-items:center;padding:2rem;' +
            'font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0C0C0C;color:#D7E2EA">' +
            '<div style="max-width:34rem;text-align:center">' +
            '<h1 style="font-size:1.5rem;margin:0 0 1rem">This site has not been built yet</h1>' +
            '<p style="line-height:1.6;color:#D7E2EA/70">' +
            'The page loaded but the application bundle did not. In the repository, open ' +
            '<strong>Settings &rarr; Pages &rarr; Build and deployment</strong> and set ' +
            '<strong>Source</strong> to <strong>GitHub Actions</strong>, then run the ' +
            '<em>Deploy to GitHub Pages</em> workflow again.' +
            '</p></div></div>';
        }, 2500);
      })();
    </script>
  </body>
</html>
